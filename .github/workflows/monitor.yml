name: Counseling & EAP Job Monitor

on:
  schedule:
    # 한국 시간(KST, UTC+9) 매일 오전 8시 -> UTC 23:00 (전날)
    - cron: '0 23 * * *'
    # 한국 시간(KST, UTC+9) 매일 오후 1시(13시) -> UTC 04:00
    - cron: '0 4 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 즉시 실행 지원

permissions:
  contents: write # seen_jobs.json 자동 커밋 & 푸시를 위한 쓰기 권한 부여

concurrency:
  group: job-monitor-pipeline
  cancel-in-progress: false

jobs:
  monitor-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler & LLM Notification Pipeline
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
        run: |
          python main.py

      - name: Commit and push updated seen_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if git diff --staged --quiet; then
            echo "변경된 seen_jobs.json 내역이 없습니다."
          else
            git commit -m "chore: update seen_jobs.json [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
